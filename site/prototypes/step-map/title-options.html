<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>マップのタイトル・3案｜はれトク試作</title>
  <link rel="stylesheet" href="/shared/styles/main.css">
  <style>
    body { margin:0; background:#f4f7ef; color:#123f31; }
    main { width:min(1040px,calc(100% - 48px)); margin:32px auto 44px; }
    .page-heading { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:24px; }
    h1 { font-size:22px; margin:0; }
    .page-heading a { font-size:13px; padding:12px 0; }
    article { margin-bottom:24px; border:1px solid #d3dfd0; border-radius:16px; overflow:hidden; background:#fff; }
    .option-heading { display:flex; align-items:center; gap:12px; padding:15px 22px; border-bottom:1px solid #dce5d6; }
    h2 { font-size:17px; margin:0; line-height:1.5; }
    .letter { width:30px; height:30px; display:grid; place-items:center; background:#123f31; color:#fff; border-radius:50%; font-weight:900; flex-shrink:0; }
    .stage { position:relative; height:250px; display:grid; place-items:center; padding:25px 30px 65px; background:radial-gradient(ellipse at 0% 130%,#e2ecd5 0 38%,transparent 38.3%),radial-gradient(ellipse at 100% 130%,#dcebe2 0 30%,transparent 30.3%),#f8faf3; }
    .road { position:absolute; left:0; bottom:0; height:78px; width:100%; }
    .road-outline { fill:none; stroke:#d0e0d2; stroke-width:28px; }
    .road-fill { fill:none; stroke:#fffef7; stroke-width:23px; }
    .road-spaces { fill:none; stroke:#c5d7c9; stroke-width:23px; stroke-dasharray:2 29; }
    .title { position:relative; z-index:1; text-align:center; line-height:1.2; }
    .a .title { font-family:"Noto Sans JP",sans-serif; font-weight:900; transform:skew(-5deg); }
    .eyebrow { display:block; font-size:22px; line-height:1.4; }
    .main-word { display:block; font-size:58px; white-space:nowrap; }
    .a .main-word { letter-spacing:-.055em; color:#f4c548; -webkit-text-stroke:1.5px #123f31; paint-order:stroke fill; text-shadow:3px 4px 0 #123f31; }
    .a .eyebrow { margin-bottom:9px; letter-spacing:.04em; }
    .b .title { padding:27px 32px 23px; border:2px solid #d6b76b; border-radius:18px; background:#fffdf3; box-shadow:0 5px 0 #e5d8b5; font-family:"Zen Maru Gothic",sans-serif; font-size:45px; font-weight:900; }
    .b .title span { display:inline; }
    .scene { position:absolute; z-index:2; width:92px; height:92px; }
    .b .panel-scene { left:-34px; top:-64px; transform:rotate(-8deg); }
    .b .house-scene { right:-34px; top:-60px; transform:rotate(7deg); }
    .c .title { display:flex; align-items:center; gap:22px; padding:15px 28px 20px; border-radius:8px; background:#fffdf3; box-shadow:0 6px 0 #e5d8b5; border-bottom:4px solid #ebbd44; text-align:left; }
    .c .house-icon { width:92px; height:92px; flex-shrink:0; }
    .c .eyebrow { font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:22px; margin-bottom:4px; }
    .c .main-word { font-family:"Noto Sans JP",sans-serif; font-size:50px; font-weight:900; letter-spacing:-.045em; }
    .description { padding:13px 22px 15px; font-size:13px; line-height:1.7; margin:0; color:#526557; }
    .svg-library { position:absolute; width:0; height:0; overflow:hidden; }
    @media (max-width:680px) {
      main { width:calc(100% - 24px); margin-top:18px; }
      .page-heading { display:block; }.page-heading a { display:inline-block; }
      .option-heading { padding:12px 14px; }h2 { font-size:15px; }
      .stage { height:265px; padding-inline:12px; }
      .main-word { font-size:40px; }
      .b .title { font-size:31px; padding:27px 18px 20px; }
      .b .title span { display:block; }
      .b .scene { width:66px; height:66px; top:-42px; }
      .b .panel-scene { left:-15px; }.b .house-scene { right:-15px; }
      .c .title { gap:9px; padding:16px 10px 20px; }
      .c .house-icon { width:58px; height:58px; }
      .c .eyebrow { font-size:17px; }.c .main-word { font-size:29px; }
      .description { padding-inline:14px; font-size:12px; }
    }
  </style>
</head>
<body>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="road" viewBox="0 0 1000 80">
      <path class="road-outline" d="M-40 65Q260-5 480 45T1040 45"/>
      <path class="road-fill" d="M-40 65Q260-5 480 45T1040 45"/>
      <path class="road-spaces" d="M-40 65Q260-5 480 45T1040 45"/>
    </symbol>
  </svg>
  <main>
    <div class="page-heading"><h1>マップのタイトル・3案</h1><a href="./#map">試作マップへ戻る →</a></div>
    <article class="a">
      <div class="option-heading"><span class="letter">A</span><h2>文字で締める</h2></div>
      <div class="stage">
        <div class="title"><span class="eyebrow">わが家の</span><span class="main-word">太陽光えらび</span></div>
        <svg class="road" aria-hidden="true"><use href="#road"/></svg>
      </div>
      <p class="description">極太の角ゴシック，少しの傾き，縁取りと立体影．ゲームのタイトルらしさを強く出す．</p>
    </article>
    <article class="b">
      <div class="option-heading"><span class="letter">B</span><h2>カードの両角に家とパネル</h2></div>
      <div class="stage">
        <div class="title">
          <svg class="scene panel-scene" viewBox="0 0 120 120" aria-hidden="true"><use href="./assets/title-art.svg#solar-panel"/></svg>
          <div class="title-copy">わが家の<span>太陽光えらび</span></div>
          <svg class="scene house-scene" viewBox="0 0 120 120" aria-hidden="true"><use href="./assets/title-art.svg#solar-house"/></svg>
        </div>
        <svg class="road" aria-hidden="true"><use href="#road"/></svg>
      </div>
      <p class="description">今の丸文字の看板を生かし，カードの左上にパネル，右上に家を重ねる．絵とタイトルを一体にする．</p>
    </article>
    <article class="c">
      <div class="option-heading"><span class="letter">C</span><h2>小さな絵＋文字の強弱</h2></div>
      <div class="stage">
        <div class="title"><svg class="house-icon" viewBox="0 0 120 120" aria-hidden="true"><use href="./assets/title-art.svg#solar-house"/></svg><div><span class="eyebrow">わが家の</span><span class="main-word">太陽光えらび</span></div></div>
        <svg class="road" aria-hidden="true"><use href="#road"/></svg>
      </div>
      <p class="description">「わが家の」を小さく，「太陽光えらび」を大きく．屋根のパネルを添えて，まとまりと親しみを両立する．</p>
    </article>
  </main>
</body>
</html>
