<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>共有画像の原稿｜はれトク</title>
<link rel="stylesheet" href="../../shared/styles/main.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}body{display:block;background:#fafbf5;color:#123f31;font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif}
.card{position:relative;width:1200px;height:630px;overflow:hidden;background:#fafbf5}
.wash{position:absolute;border-radius:50%;background:#e7efdc;width:760px;height:820px;left:-460px;top:-210px}.wash.right{background:#e0ede4;width:680px;height:780px;left:820px;top:60px}
.brand{position:absolute;left:68px;top:35px;color:#008653;font-size:38px;line-height:1;font-weight:900;letter-spacing:-.08em}.brand img{width:46px;height:46px;object-fit:contain;position:absolute;left:126px;top:-13px}
h1{position:absolute;left:68px;top:134px;font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;font-size:80px;line-height:1.28;letter-spacing:.01em;font-weight:900;margin:0}
.subtitle{position:absolute;left:72px;top:375px;font-family:"Noto Sans JP",sans-serif;font-size:27px;line-height:1.6;font-weight:500;margin:0}
.steps{position:absolute;left:72px;top:508px;display:flex;gap:14px;align-items:center;font-size:25px;font-weight:700}.steps b{display:block;background:#fffdf3;border:1.5px solid #d6b76b;border-radius:50px;padding:10px 22px}.steps i{font-style:normal;color:#7c9f89}
.art{position:absolute;inset:0;width:1200px;height:630px}.road{fill:none;stroke-linecap:round;stroke-linejoin:round}.outer{stroke:#bdcfbf;stroke-width:55}.inner{stroke:#fffdf3;stroke-width:47}.yellow{stroke:#fff0c8;stroke-width:45;stroke-dasharray:30 115}.green{stroke:#d8eadd;stroke-width:45;stroke-dasharray:30 115;stroke-dashoffset:-72}.dividers{stroke:#bdcfbf;stroke-width:47;stroke-dasharray:2 34}
.professor{position:absolute;width:225px;height:225px;object-fit:contain;left:590px;top:329px}.harena{position:absolute;width:225px;height:225px;object-fit:contain;left:900px;top:22px}
.bubble{position:absolute;left:771px;top:455px;background:#fffdf3;border:1.5px solid #c6d6c5;border-radius:19px;padding:15px 24px;font-size:26px;font-weight:700;transform:rotate(-2deg)}.bubble:before{content:"";position:absolute;left:-9px;top:25px;width:16px;height:16px;background:#fffdf3;border-left:1.5px solid #c6d6c5;border-bottom:1.5px solid #c6d6c5;transform:rotate(45deg)}
.node{fill:#fffdf3;stroke:#b7cdbb;stroke-width:2}.house{position:absolute;left:886px;top:210px;width:175px;height:175px;filter:drop-shadow(0 5px 0 #dce7d8)}.battery{position:absolute;left:1053px;top:310px;width:77px;height:77px}
.yellow,.green,.dividers{stroke-linecap:butt}
.sun-mark{position:absolute;left:748px;top:240px;width:66px;height:66px;object-fit:contain}.domain{position:absolute;right:50px;bottom:25px;color:#638b72;font-family:"Noto Sans JP",sans-serif;font-size:19px;letter-spacing:.07em}
</style>
<main class="card">
  <div class="wash"></div><div class="wash right"></div>
  <svg class="art" viewBox="0 0 1200 630" aria-hidden="true">
    <defs><path id="route" d="M700 477C625 438 641 353 734 353S832 413 914 382S1065 343 1070 257"/></defs>
    <use href="#route" class="road outer"/><use href="#route" class="road inner"/><use href="#route" class="road yellow"/><use href="#route" class="road green"/><use href="#route" class="road dividers"/>
    <rect class="node" x="750" y="302" width="88" height="88" rx="21" transform="rotate(-6 794 346)"/>
    <g transform="translate(770 323)" stroke="#267254" stroke-width="3" fill="none" stroke-linecap="round"><rect x="6" y="0" width="31" height="46" rx="4"/><path d="M13 9h17v8H13Zm0 18h3m9 0h3m-15 9h3m9 0h3"/></g>
    <g transform="translate(1133 449)" stroke="#8bae91" stroke-width="3"><path d="m0 0-15 37h30Z" fill="#dce9d3"/><path d="M0 37v23"/></g>
    <g transform="translate(593 245)" stroke="#8bae91" stroke-width="3"><path d="m0 0-13 32h26Z" fill="#dce9d3"/><path d="M0 32v20"/></g>
  </svg>
  <div class="brand">はれトク<img src="../assets/navigator.png" alt=""></div>
  <h1>わが家の<br>太陽光えらび</h1>
  <p class="subtitle">太陽光・蓄電池の費用と選び方を，<br>マップで一つずつ．</p>
  <div class="steps"><b>知る</b><i>→</i><b>比べる</b><i>→</i><b>相談する</b></div>
  <img class="professor" src="../assets/professor-chibi.png" alt="はれトク博士">
  <img class="harena" src="../assets/navigator.png" alt="ハレナ">
  <svg class="house" aria-label="太陽光パネルのある家"><use href="../assets/title-art.svg#solar-house"/></svg>
  <svg class="battery" aria-label="蓄電池"><use href="../assets/title-art.svg#storage-battery"/></svg>
  <div class="bubble">いっしょに確かめよう</div>
  <div class="domain">haretoku.jp</div>
</main>
</html>
