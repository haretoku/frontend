<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="はれトクの太陽マーク再調整案です．">
    <title>はれトク｜太陽マーク再調整</title>
    <link rel="icon" href="shared/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="shared/styles/logo-finalists.css">
  </head>
  <body>
    <header class="study-header">
      <div class="page-width study-header__inner">
        <a href="/logo-competition">← コンペ履歴へ戻る</a>
        <span>Brand study / sun refinement</span>
      </div>
    </header>

    <main>
      <section class="intro page-width">
        <p class="eyebrow">ユーザー案を基準に再調整</p>
        <h1>太陽を「ク」の右上端へ，<br>きちんと重ねる．</h1>
        <p class="lead">サイトで採用しているZen Maru Gothic，全文字と￥の深緑，橙黄色の太陽は固定します．太陽の中心は必ず「ク」の外側右上に置き，重なり量と上下位置だけを比較します．</p>
      </section>

      <form class="finalist-grid page-width" aria-label="太陽マークの再調整案">
        <label class="finalist-card">
          <input type="radio" name="finalist-vote" value="r1">
          <span class="logo-stage logo-stage--r1">
            <span class="word-hare">はれ</span><span class="toku-lockup"><span class="word-toku">トク</span><svg class="yen-sun" viewBox="0 0 100 100" aria-hidden="true"><g class="sun-rays"><path d="M50 4V17M50 83V96M4 50H17M83 50H96"/></g><circle class="sun-disc" cx="50" cy="50" r="31"/><path class="yen-path" d="M34 32L50 49L66 32M50 49V70M37 52H63M37 61H63"/></svg></span>
          </span>
          <span class="usage-row"><span class="header-preview"><span class="preview-label">ヘッダー実寸</span><span class="mini-logo mini-logo--r1"><span class="word-hare">はれ</span><span class="toku-lockup"><span class="word-toku">トク</span><svg class="yen-sun" viewBox="0 0 100 100" aria-hidden="true"><g class="sun-rays"><path d="M50 4V17M50 83V96M4 50H17M83 50H96"/></g><circle class="sun-disc" cx="50" cy="50" r="31"/><path class="yen-path" d="M34 32L50 49L66 32M50 49V70M37 52H63M37 61H63"/></svg></span></span></span><span class="copy-preview">結局いくら<span class="inline-toku">トク<span class="inline-mark">¥</span></span>？</span></span>
          <span class="card-meta"><b>P1．右上へ小</b><small>右へ0.03em／上へ0.03em</small></span>
          <span class="description">現在位置から右上へ最小限だけ移動した案．曲がり角との重なりを保ちながら，円の中心を少し外側へ戻す．</span>
        </label>

        <label class="finalist-card">
          <input type="radio" name="finalist-vote" value="r2">
          <span class="logo-stage logo-stage--r2">
            <span class="word-hare">はれ</span><span class="toku-lockup"><span class="word-toku">トク</span><svg class="yen-sun" viewBox="0 0 100 100" aria-hidden="true"><g class="sun-rays"><path d="M50 4V17M50 83V96M4 50H17M83 50H96"/></g><circle class="sun-disc" cx="50" cy="50" r="31"/><path class="yen-path" d="M34 32L50 49L66 32M50 49V70M37 52H63M37 61H63"/></svg></span>
          </span>
          <span class="usage-row"><span class="header-preview"><span class="preview-label">ヘッダー実寸</span><span class="mini-logo mini-logo--r2"><span class="word-hare">はれ</span><span class="toku-lockup"><span class="word-toku">トク</span><svg class="yen-sun" viewBox="0 0 100 100" aria-hidden="true"><g class="sun-rays"><path d="M50 4V17M50 83V96M4 50H17M83 50H96"/></g><circle class="sun-disc" cx="50" cy="50" r="31"/><path class="yen-path" d="M34 32L50 49L66 32M50 49V70M37 52H63M37 61H63"/></svg></span></span></span><span class="copy-preview">結局いくら<span class="inline-toku">トク<span class="inline-mark inline-mark--low">¥</span></span>？</span></span>
          <span class="card-meta"><b>P2．右へ中・上へ小</b><small>右へ0.06em／上へ0.03em</small></span>
          <span class="description">P1より右へ寄せた案．クとの接合は残しつつ，太陽の円を少し見せやすくする．</span>
        </label>

        <label class="finalist-card">
          <input type="radio" name="finalist-vote" value="r3">
          <span class="logo-stage logo-stage--r3">
            <span class="word-hare">はれ</span><span class="toku-lockup"><span class="word-toku">トク</span><svg class="yen-sun" viewBox="0 0 100 100" aria-hidden="true"><g class="sun-rays"><path d="M50 4V17M50 83V96M4 50H17M83 50H96"/></g><circle class="sun-disc" cx="50" cy="50" r="31"/><path class="yen-path" d="M34 32L50 49L66 32M50 49V70M37 52H63M37 61H63"/></svg></span>
          </span>
          <span class="usage-row"><span class="header-preview"><span class="preview-label">ヘッダー実寸</span><span class="mini-logo mini-logo--r3"><span class="word-hare">はれ</span><span class="toku-lockup"><span class="word-toku">トク</span><svg class="yen-sun" viewBox="0 0 100 100" aria-hidden="true"><g class="sun-rays"><path d="M50 4V17M50 83V96M4 50H17M83 50H96"/></g><circle class="sun-disc" cx="50" cy="50" r="31"/><path class="yen-path" d="M34 32L50 49L66 32M50 49V70M37 52H63M37 61H63"/></svg></span></span></span><span class="copy-preview">結局いくら<span class="inline-toku">トク<span class="inline-mark inline-mark--tight">¥</span></span>？</span></span>
          <span class="card-meta"><b>P3．右へ小・上へ中</b><small>右へ0.03em／上へ0.06em</small></span>
          <span class="description">P1より上へ寄せた案．曲がり角は見えやすくなるが，マークの浮遊感は少し戻る．</span>
        </label>

        <label class="finalist-card finalist-card--recommended">
          <input type="radio" name="finalist-vote" value="r4" checked>
          <span class="badge">確定案</span>
          <span class="logo-stage logo-stage--r4">
            <span class="word-hare">はれ</span><span class="toku-lockup"><span class="word-toku">トク</span><svg class="yen-sun" viewBox="0 0 100 100" aria-hidden="true"><g class="sun-rays"><path d="M28.08 28.08L19.59 19.59M50 7V19M71.92 28.08L80.41 19.59M81 50H93M71.92 71.92L80.41 80.41"/></g><circle class="sun-disc" cx="50" cy="50" r="31"/><path class="yen-path" d="M34 32L50 49L66 32M50 49V70M37 52H63M37 61H63"/></svg></span>
          </span>
          <span class="usage-row"><span class="header-preview"><span class="preview-label">ヘッダー実寸</span><span class="mini-logo mini-logo--r4"><span class="word-hare">はれ</span><span class="toku-lockup"><span class="word-toku">トク</span><svg class="yen-sun" viewBox="0 0 100 100" aria-hidden="true"><g class="sun-rays"><path d="M28.08 28.08L19.59 19.59M50 7V19M71.92 28.08L80.41 19.59M81 50H93M71.92 71.92L80.41 80.41"/></g><circle class="sun-disc" cx="50" cy="50" r="31"/><path class="yen-path" d="M34 32L50 49L66 32M50 49V70M37 52H63M37 61H63"/></svg></span></span></span><span class="copy-preview">結局いくら<span class="inline-toku">トク<span class="inline-mark inline-mark--coin">¥</span></span>？</span></span>
          <span class="card-meta"><b>P4．確定</b><small>右へ0.05em／上へ0.05em</small></span>
          <span class="description">P4位置に，左上・上・右上・右・右下の5本線を同じ長さで配置する．クと一体化しつつ，太陽らしさを保つ．</span>
        </label>
      </form>

      <section class="decision page-width">
        <p class="eyebrow">現時点の推奨</p>
        <p><b>P4を正式案として全体へ適用しました．</b> 太陽はクの右上の曲がり角へ重ね，左上・上・右上・右・右下へ同じ長さの5本線を出します．文字と￥は深緑，太陽は橙黄色です．</p>
      </section>
    </main>
  </body>
</html>
