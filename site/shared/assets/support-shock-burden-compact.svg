<svg xmlns="http://www.w3.org/2000/svg" width="360" height="385" viewBox="0 0 360 385" role="img"><title>設備別の支援終了による年間追加負担</title><style>text{font-family:Meiryo,"Yu Gothic",sans-serif}</style><rect x="0" y="0" width="360" height="385" fill="#fff"/><text x="12" y="26" font-size="16" fill="#173e35" text-anchor="start">太陽光・蓄電池なし</text><rect x="12" y="36" width="284.3046" height="22" fill="#547888"/><text x="338" y="76" font-size="16" fill="#173e35" text-anchor="end">＋17,442円／年</text><text x="12" y="108" font-size="16" fill="#173e35" text-anchor="start">太陽光のみ</text><rect x="12" y="118" width="197.73530000000002" height="22" fill="#21876d"/><text x="338" y="158" font-size="16" fill="#173e35" text-anchor="end">＋12,131円／年</text><text x="12" y="190" font-size="16" fill="#173e35" text-anchor="start">太陽光＋蓄電池 5 kWh</text><rect x="12" y="200" width="122.8694" height="22" fill="#21876d"/><text x="338" y="240" font-size="16" fill="#173e35" text-anchor="end">＋7,538円／年</text><text x="12" y="272" font-size="16" fill="#173e35" text-anchor="start">太陽光＋蓄電池 9.5 kWh</text><rect x="12" y="282" width="84.97189999999999" height="22" fill="#21876d"/><text x="338" y="322" font-size="16" fill="#173e35" text-anchor="end">＋5,213円／年</text><line x1="12" y1="346" x2="338" y2="346" stroke="#dce5df"/><text x="12" y="369" font-size="14" fill="#5d6d67" text-anchor="start">0円</text><text x="175" y="369" font-size="14" fill="#5d6d67" text-anchor="middle">10,000円</text><text x="338" y="369" font-size="14" fill="#5d6d67" text-anchor="end">20,000円</text></svg>
